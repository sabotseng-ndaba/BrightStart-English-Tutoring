<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../css/app.css">

    <title>Learners</title>
</head>

<body>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Main Application JavaScript -->
    <script src="../js/app.js"></script>

    <script>

        adminGuard();


        async function loadLearners() {

            const { data, error } =
                await supabaseClient
                    .from('parents')
                    .select('*')
                    .order('created_at', { ascending: false });


            if (error) {

                console.error(error);

                alert(
                    'Could not load learners: ' +
                    error.message
                );

                return;
            }


            const learners = data || [];


            console.log(
                'Learners from Supabase:',
                learners
            );


            shell(
                'admin',
                'learners',
                'Learners',

                `
                <h1>Registered Learners</h1>

                <div class="table-wrap">

                    <table>

                        <tr>
                            <th>Learner</th>
                            <th>Gender</th>
                            <th>Grade</th>
                            <th>Parent</th>
                            <th>Email</th>
                        </tr>


                        ${learners.map(u => `

                            <tr>

                                <td>
                                    ${u.child_first_name || ''}
                                    ${u.child_last_name || ''}
                                </td>

                                <td>
                                    ${u.child_gender || '—'}
                                </td>

                                <td>
                                    ${u.child_grade || '—'}
                                </td>

                                <td>
                                    ${u.first_name || ''}
                                    ${u.last_name || ''}
                                </td>

                                <td>
                                    ${u.email || '—'}
                                </td>

                            </tr>

                        `).join('') || `

                            <tr>

                                <td colspan="5">
                                    No registered learners yet.
                                </td>

                            </tr>

                        `}

                    </table>

                </div>
                `
            );
        }


        loadLearners();

    </script>

</body>

</html>
