<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../css/app.css">

    <title>Learners</title>
</head>

<body>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Main Application JavaScript -->
    <script src="../js/app.js"></script>

    <script>
        adminGuard();

        const u = store.get('bs_parent');


        shell(
            'admin',
            'learners',
            'Learners',

            `
            <h1>Registered Learners</h1>

            <div class="table-wrap">

                <table>

                    <tr>
                        <th>Learner</th>
                        <th>Gender</th>
                        <th>Grade</th>
                        <th>Parent</th>
                        <th>Email</th>
                    </tr>

                    ${u ? `

                        <tr>
                            <td>
                                ${u.child.first} ${u.child.last}
                            </td>

                            <td>
                                ${u.child.gender}
                            </td>

                            <td>
                                ${u.child.grade}
                            </td>

                            <td>
                                ${u.first} ${u.last}
                            </td>

                            <td>
                                ${u.email}
                            </td>
                        </tr>

                    ` : `

                        <tr>
                            <td colspan="5">
                                No registered learners yet.
                            </td>
                        </tr>

                    `}

                </table>

            </div>
            `
        );
    </script>

</body>

</html>
