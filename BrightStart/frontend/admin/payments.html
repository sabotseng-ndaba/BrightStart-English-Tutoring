<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../css/app.css">

    <title>Payments</title>
</head>

<body>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Main Application JavaScript -->
    <script src="../js/app.js"></script>

    <script>

        adminGuard();


        async function loadPayments() {

            const { data, error } =
                await supabaseClient
                    .from('payments')
                    .select('*')
                    .order('created_at', { ascending: false });


            if (error) {

                console.error(error);

                alert(
                    'Could not load payments: ' +
                    error.message
                );

                return;
            }


            const payments = data || [];


            console.log(
                'Payments from Supabase:',
                payments
            );


            shell(
                'admin',
                'payments',
                'Payment Verification',

                `
                <h1>Verify Proof of Payment</h1>

                <div class="table-wrap">

                    <table>

                        <tr>
                            <th>Booking Ref</th>
                            <th>Parent</th>
                            <th>Amount</th>
                            <th>Proof</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>


                        ${payments.map(p => `

                            <tr>

                                <td>
                                    ${p.booking_id || '—'}
                                </td>

                                <td>
                                    ${p.parent_email}
                                </td>

                                <td>
                                    R${p.amount}
                                </td>

                                <td>
                                    ${p.proof_of_payment || 'Not uploaded'}
                                </td>

                                <td>
                                    ${p.payment_status}
                                </td>

                                <td>

                                    ${p.payment_status !== 'Verified' ? `

                                        <button
                                            class="btn btn-green"
                                            onclick="verifyPayment(${p.id}, ${p.booking_id || 'null'})"
                                        >
                                            Verify
                                        </button>

                                        <button
                                            class="btn btn-outline"
                                            onclick="rejectPayment(${p.id}, ${p.booking_id || 'null'})"
                                        >
                                            Reject
                                        </button>

                                    ` : 'Verified ✓'}

                                </td>

                            </tr>

                        `).join('') || `

                            <tr>

                                <td colspan="6">
                                    No payments.
                                </td>

                            </tr>

                        `}

                    </table>

                </div>
                `
            );
        }


        async function verifyPayment(paymentId, bookingId) {

            const { error: paymentError } =
                await supabaseClient
                    .from('payments')
                    .update({
                        payment_status: 'Verified',
                        verified_at: new Date().toISOString()
                    })
                    .eq('id', paymentId);


            if (paymentError) {

                console.error(paymentError);

                alert(
                    'Payment could not be verified: ' +
                    paymentError.message
                );

                return;
            }


            if (bookingId) {

                const { error: bookingError } =
                    await supabaseClient
                        .from('bookings')
                        .update({
                            status: 'Confirmed'
                        })
                        .eq('id', bookingId);


                if (bookingError) {

                    console.error(bookingError);

                    alert(
                        'Payment was verified, but booking status could not be updated: ' +
                        bookingError.message
                    );

                    return;
                }
            }


            alert('Payment verified successfully.');

            location.reload();
        }


        async function rejectPayment(paymentId, bookingId) {

            const { error: paymentError } =
                await supabaseClient
                    .from('payments')
                    .update({
                        payment_status: 'Rejected',
                        verified_at: null
                    })
                    .eq('id', paymentId);


            if (paymentError) {

                console.error(paymentError);

                alert(
                    'Payment could not be rejected: ' +
                    paymentError.message
                );

                return;
            }


            if (bookingId) {

                const { error: bookingError } =
                    await supabaseClient
                        .from('bookings')
                        .update({
                            status: 'Payment Action Required'
                        })
                        .eq('id', bookingId);


                if (bookingError) {

                    console.error(bookingError);

                    alert(
                        'Payment was rejected, but booking status could not be updated: ' +
                        bookingError.message
                    );

                    return;
                }
            }


            alert('Payment rejected.');

            location.reload();
        }


        loadPayments();

    </script>

</body>

</html>
