<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../css/app.css">

    <title>Bookings</title>
</head>

<body>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Main Application JavaScript -->
    <script src="../js/app.js"></script>

    <script>
        adminGuard();

        let a = [];

        async function loadBookings() {

            const { data, error } =
                await supabaseClient
                    .from('bookings')
                    .select('*')
                    .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                alert('Could not load bookings: ' + error.message);
                return;
            }

            a = data || [];

            console.log('Bookings from Supabase:', a);
        }

        await loadBookings();



        shell(
            'admin',
            'bookings',
            'Bookings',

            `
            <h1>All Bookings</h1>

            <div class="table-wrap">

                <table>

                    <tr>
                        <th>Ref</th>
                        <th>Learner</th>
                        <th>Program</th>
                        <th>Date</th>
                        <th>Booking</th>
                        <th>Payment</th>
                    </tr>

                    ${a.map(b => `

                        <tr>
                            <td>${b.id}</td>
                            <td>${b.child_name}</td>
                            <td>${b.program}</td>
                            <td>${b.booking_date}</td>
                            <td>${b.status}</td>
                            <td>Pending</td>
                        </tr>

                    `).join('') || `

                        <tr>
                            <td colspan="6">
                                No bookings.
                            </td>
                        </tr>

                    `}

                </table>

            </div>
            `
        );
    </script>

</body>

</html>
