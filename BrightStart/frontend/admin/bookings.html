<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../css/app.css">

    <title>Bookings</title>
</head>

<body>

    <!-- Main Application JavaScript -->
    <script src="../js/app.js"></script>

    <script>
        adminGuard();

        const a = store.get('bs_bookings', []);


        shell(
            'admin',
            'bookings',
            'Bookings',

            `
            <h1>All Bookings</h1>

            <div class="table-wrap">

                <table>

                    <tr>
                        <th>Ref</th>
                        <th>Learner</th>
                        <th>Program</th>
                        <th>Date</th>
                        <th>Booking</th>
                        <th>Payment</th>
                    </tr>

                    ${a.map(b => `

                        <tr>
                            <td>${b.id}</td>
                            <td>${b.learner}</td>
                            <td>${b.program}</td>
                            <td>${b.date}</td>
                            <td>${b.bookingStatus}</td>
                            <td>${b.paymentStatus}</td>
                        </tr>

                    `).join('') || `

                        <tr>
                            <td colspan="6">
                                No bookings.
                            </td>
                        </tr>

                    `}

                </table>

            </div>
            `
        );
    </script>

</body>

</html>
