<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../css/app.css">

    <title>Update Progress</title>
</head>

<body>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Main Application JavaScript -->
    <script src="../js/app.js"></script>

    <script>

        staffGuard();


        let learners = [];
        let selectedLearner = null;
        let existingProgressId = null;


        async function loadLearners() {

            const { data, error } =
                await supabaseClient
                    .from('parents')
                    .select('*')
                    .order('created_at', { ascending: false });


            if (error) {

                console.error(error);

                alert(
                    'Could not load learners: ' +
                    error.message
                );

                return;
            }


            learners = data || [];


            shell(
                'admin',
                'progress',
                'Update Learner Progress',

                `
                <h1>Update Learner Progress</h1>


                <div class="card">

                    <div class="field">

                        <label>
                            Select Learner
                        </label>

                        <select id="learnerSelect">

                            <option value="">
                                Choose a learner
                            </option>

                        </select>

                    </div>

                </div>


                <div
                    id="progressSection"
                    class="card"
                    style="display: none; margin-top: 20px;"
                >

                    <h2 id="learnerName">
                        Learner Progress
                    </h2>


                    <form
                        id="progressForm"
                        class="form-grid"
                    >

                        <!-- Reading -->
                        <div class="field">

                            <label>
                                Reading %
                            </label>

                            <input
                                id="reading"
                                type="number"
                                min="0"
                                max="100"
                                required
                            >

                        </div>


                        <!-- Writing -->
                        <div class="field">

                            <label>
                                Writing %
                            </label>

                            <input
                                id="writing"
                                type="number"
                                min="0"
                                max="100"
                                required
                            >

                        </div>


                        <!-- Comprehension -->
                        <div class="field">

                            <label>
                                Comprehension %
                            </label>

                            <input
                                id="comprehension"
                                type="number"
                                min="0"
                                max="100"
                                required
                            >

                        </div>


                        <!-- Speaking -->
                        <div class="field">

                            <label>
                                Speaking %
                            </label>

                            <input
                                id="speaking"
                                type="number"
                                min="0"
                                max="100"
                                required
                            >

                        </div>


                        <!-- Tutor Feedback -->
                        <div class="field full">

                            <label>
                                Tutor Comment
                            </label>

                            <textarea
                                id="comment"
                                rows="5"
                                placeholder="Enter feedback about the learner's progress..."
                            ></textarea>

                        </div>


                        <!-- Save Button -->
                        <div class="field full">

                            <button
                                type="submit"
                                class="btn btn-blue"
                            >
                                Save Progress
                            </button>

                        </div>

                    </form>

                </div>
                `
            );


            const learnerSelect =
                document.getElementById('learnerSelect');


            learners.forEach((learner, index) => {

                const option =
                    document.createElement('option');

                option.value = index;

                option.textContent =
                    `${learner.child_first_name || ''} ${learner.child_last_name || ''} -  ${learner.child_grade || '—'}`;

                learnerSelect.appendChild(option);
            });


            learnerSelect.addEventListener(
                'change',
                selectLearner
            );


            document
                .getElementById('progressForm')
                .addEventListener(
                    'submit',
                    saveProgress
                );
        }


        async function selectLearner() {

            const learnerSelect =
                document.getElementById('learnerSelect');


            if (learnerSelect.value === '') {

                selectedLearner = null;
                existingProgressId = null;

                document
                    .getElementById('progressSection')
                    .style.display = 'none';

                return;
            }


            selectedLearner =
                learners[Number(learnerSelect.value)];


            document
                .getElementById('progressSection')
                .style.display = 'block';


            document
                .getElementById('learnerName')
                .textContent =
                    `${selectedLearner.child_first_name || ''} ${selectedLearner.child_last_name || ''}`;


            await loadExistingProgress();
        }


        async function loadExistingProgress() {

            existingProgressId = null;


            document.getElementById('reading').value = 0;
            document.getElementById('writing').value = 0;
            document.getElementById('comprehension').value = 0;
            document.getElementById('speaking').value = 0;
            document.getElementById('comment').value = '';


            const { data, error } =
                await supabaseClient
                    .from('progress')
                    .select('*')
                    .eq(
                        'parent_email',
                        selectedLearner.email
                    )
                    .order(
                        'updated_at',
                        { ascending: false }
                    )
                    .limit(1);


            if (error) {

                console.error(error);

                alert(
                    'Could not load existing progress: ' +
                    error.message
                );

                return;
            }


            if (data && data.length > 0) {

                const progress = data[0];

                existingProgressId =
                    progress.id;


                document.getElementById('reading').value =
                    progress.reading || 0;

                document.getElementById('writing').value =
                    progress.writing || 0;

                document.getElementById('comprehension').value =
                    progress.comprehension || 0;

                document.getElementById('speaking').value =
                    progress.speaking || 0;

                document.getElementById('comment').value =
                    progress.tutor_feedback || '';
            }
        }


        async function saveProgress(event) {

            event.preventDefault();


            if (!selectedLearner) {

                alert(
                    'Please select a learner first.'
                );

                return;
            }


            const progressData = {

                parent_email:
                    selectedLearner.email,

                child_name:
                    `${selectedLearner.child_first_name || ''} ${selectedLearner.child_last_name || ''}`.trim(),

                grade:
                    selectedLearner.child_grade,

                reading:
                    document.getElementById('reading').value,

                writing:
                    document.getElementById('writing').value,

                comprehension:
                    document.getElementById('comprehension').value,

                speaking:
                    document.getElementById('speaking').value,

                tutor_feedback:
                    document.getElementById('comment').value,

                updated_at:
                    new Date().toISOString()
            };


            let error;


            if (existingProgressId) {

                const result =
                    await supabaseClient
                        .from('progress')
                        .update(progressData)
                        .eq(
                            'id',
                            existingProgressId
                        );

                error = result.error;

            } else {

                const result =
                    await supabaseClient
                        .from('progress')
                        .insert([
                            progressData
                        ])
                        .select()
                        .single();

                error = result.error;


                if (!error && result.data) {

                    existingProgressId =
                        result.data.id;
                }
            }


            if (error) {

                console.error(error);

                alert(
                    'Progress could not be saved: ' +
                    error.message
                );

                return;
            }


            alert(
                'Learner progress saved successfully.'
            );
        }


        loadLearners();

    </script>

</body>

</html>
