<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../css/app.css">

    <title>Update Progress</title>
</head>

<body>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Main Application JavaScript -->
    <script src="../js/app.js"></script>

    <script>
        adminGuard();

        const u = store.get('bs_parent');

        const old = u
            ? (store.get('bs_progress', {})[u.email] || {})
            : {};


        shell(
            'admin',
            'progress',
            'Update Learner Progress',

            u ? `

                <h1>
                    ${u.child.first} ${u.child.last}
                </h1>

                <div class="card">

                    <form id="pf" class="form-grid">

                        <!-- Reading -->
                        <div class="field">

                            <label>
                                Reading %
                            </label>

                            <input
                                id="reading"
                                type="number"
                                min="0"
                                max="100"
                                value="${old.reading || 0}"
                            >

                        </div>


                        <!-- Writing -->
                        <div class="field">

                            <label>
                                Writing %
                            </label>

                            <input
                                id="writing"
                                type="number"
                                min="0"
                                max="100"
                                value="${old.writing || 0}"
                            >

                        </div>


                        <!-- Comprehension -->
                        <div class="field">

                            <label>
                                Comprehension %
                            </label>

                            <input
                                id="comprehension"
                                type="number"
                                min="0"
                                max="100"
                                value="${old.comprehension || 0}"
                            >

                        </div>


                        <!-- Speaking -->
                        <div class="field">

                            <label>
                                Speaking %
                            </label>

                            <input
                                id="speaking"
                                type="number"
                                min="0"
                                max="100"
                                value="${old.speaking || 0}"
                            >

                        </div>


                        <!-- Tutor Comment -->
                        <div class="field full">

                            <label>
                                Tutor Comment
                            </label>

                            <textarea
                                id="comment"
                                rows="5"
                            >${old.comment || ''}</textarea>

                        </div>


                        <!-- Save Button -->
                        <div class="field full">

                            <button class="btn btn-blue">
                                Save Progress
                            </button>

                        </div>

                    </form>

                </div>

            ` : `

                <div class="notice">
                    No parent/learner has registered yet.
                </div>

            `
        );


        if (u) {

            pf.onsubmit = e => {

                e.preventDefault();

                const p = store.get('bs_progress', {});

                p[u.email] = {
                    reading: +reading.value,
                    writing: +writing.value,
                    comprehension: +comprehension.value,
                    speaking: +speaking.value,
                    comment: comment.value
                };

                store.set('bs_progress', p);

                notifyParent(
                    u.email,
                    `A new learning progress update has been added for ${u.child.first}.`
                );

                alert(
                    'Progress saved and parent notified.'
                );
            };
        }
    </script>

</body>

</html>
