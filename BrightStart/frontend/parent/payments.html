<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../css/app.css">

    <title>Payments</title>
</head>

<body>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Main Application JavaScript -->
    <script src="../js/app.js"></script>

    <script>

        parentGuard();

        const s = session();


        async function loadPayments() {

            // Get this parent's bookings
            const {
                data: bookings,
                error: bookingsError
            } =
                await supabaseClient
                    .from('bookings')
                    .select('*')
                    .eq('parent_email', s.email)
                    .order(
                        'created_at',
                        { ascending: false }
                    );


            if (bookingsError) {

                console.error(bookingsError);

                alert(
                    'Could not load bookings: ' +
                    bookingsError.message
                );

                return;
            }


            // Get this parent's payments
            const {
                data: payments,
                error: paymentsError
            } =
                await supabaseClient
                    .from('payments')
                    .select('*')
                    .eq('parent_email', s.email)
                    .order(
                        'created_at',
                        { ascending: false }
                    );


            if (paymentsError) {

                console.error(paymentsError);

                alert(
                    'Could not load payments: ' +
                    paymentsError.message
                );

                return;
            }


            const bookingList = bookings || [];
            const paymentList = payments || [];


            shell(
                'parent',
                'payments',
                'Payments',

                `
                <h1>EFT / Bank Deposit</h1>


                <div class="notice">

                    Demo details only — replace with approved
                    BrightStart banking details before real use.

                </div>


                <div class="card">

                    <b>Account Name:</b>
                    BrightStart English Tutoring

                    <br>

                    <b>Bank:</b>
                    Demo Bank

                    <br>

                    <b>Account:</b>
                    000 000 0000

                    <br>

                    <b>Reference:</b>
                    Use your booking reference

                </div>


                <h2>Your Payments</h2>


                <div class="table-wrap">

                    <table>

                        <tr>
                            <th>Reference</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Proof</th>
                        </tr>


                        ${bookingList.map(b => {

                            const payment =
                                paymentList.find(
                                    p =>
                                        Number(p.booking_id) ===
                                        Number(b.id)
                                );


                            const paymentStatus =
                                payment
                                    ? payment.payment_status
                                    : 'Pending';


                            const amount =
                                b.amount !== null
                                    ? `R${b.amount}`
                                    : '—';


                            let proofSection = '';


                            if (paymentStatus === 'Verified') {

                                proofSection =
                                    'Verified ✓';

                            } else if (
                                paymentStatus ===
                                'Pending Verification'
                            ) {

                                proofSection = `

                                    <div>
                                        Proof submitted
                                    </div>

                                    <div class="small">
                                        ${payment.proof_of_payment || ''}
                                    </div>
                                `;

                            } else if (b.amount === null) {

                                proofSection = `

                                    <div class="small">
                                        Amount unavailable for this
                                        older booking.
                                    </div>
                                `;

                            } else {

                                proofSection = `

                                    <input
                                        type="file"
                                        accept=".pdf,image/*"
                                        onchange="uploadProof(${b.id}, this)"
                                    >

                                    <div class="small">
                                        Upload PDF or image proof
                                    </div>
                                `;
                            }


                            return `

                                <tr>

                                    <td>
                                        ${b.id}
                                    </td>

                                    <td>
                                        ${amount}
                                    </td>

                                    <td>

                                        <span
                                            class="status ${
                                                paymentStatus === 'Verified'
                                                    ? 'paid'
                                                    : 'pending'
                                            }"
                                        >
                                            ${paymentStatus}
                                        </span>

                                    </td>

                                    <td>
                                        ${proofSection}
                                    </td>

                                </tr>
                            `;

                        }).join('') || `

                            <tr>

                                <td colspan="4">
                                    Book a session first.
                                </td>

                            </tr>

                        `}

                    </table>

                </div>
                `
            );
        }


        async function uploadProof(bookingId, el) {

            const file = el.files[0];


            if (!file) {
                return;
            }


            // Get the booking directly from Supabase
            const {
                data: booking,
                error: bookingError
            } =
                await supabaseClient
                    .from('bookings')
                    .select('*')
                    .eq('id', bookingId)
                    .eq('parent_email', s.email)
                    .single();


            if (bookingError || !booking) {

                console.error(bookingError);

                alert(
                    'Could not find this booking.'
                );

                return;
            }


            if (booking.amount === null) {

                alert(
                    'This older booking does not have an amount saved.'
                );

                return;
            }


            // Get the authenticated Supabase user
            const {
                data: userData,
                error: userError
            } =
                await supabaseClient.auth.getUser();


            if (
                userError ||
                !userData ||
                !userData.user
            ) {

                console.error(userError);

                alert(
                    'Please sign in again before uploading proof.'
                );

                return;
            }


            const user =
                userData.user;


            // Make the filename safe
            const safeName =
                file.name.replace(
                    /[^a-zA-Z0-9._-]/g,
                    '_'
                );


            const filePath =
                `${user.id}/${booking.id}-${Date.now()}-${safeName}`;


            // Upload the actual file
            const {
                data: uploadData,
                error: uploadError
            } =
                await supabaseClient
                    .storage
                    .from('payment-proofs')
                    .upload(
                        filePath,
                        file,
                        {
                            cacheControl: '3600',
                            upsert: false
                        }
                    );


            if (uploadError) {

                console.error(uploadError);

                alert(
                    'Proof could not be uploaded: ' +
                    uploadError.message
                );

                return;
            }


            // Save payment information
            const {
                error: paymentError
            } =
                await supabaseClient
                    .from('payments')
                    .insert([
                        {
                            booking_id: booking.id,
                            parent_email: s.email,
                            amount: booking.amount,
                            payment_method:
                                'EFT / Bank Deposit',
                            proof_of_payment:
                                uploadData.path,
                            payment_status:
                                'Pending Verification'
                        }
                    ]);


            if (paymentError) {

                console.error(paymentError);

                alert(
                    'Payment could not be submitted: ' +
                    paymentError.message
                );

                return;
            }


            // Update the booking status
            const {
                error: statusError
            } =
                await supabaseClient
                    .from('bookings')
                    .update({
                        status:
                            'Awaiting Verification'
                    })
                    .eq('id', booking.id);


            if (statusError) {

                console.error(statusError);

                alert(
                    'Proof was submitted, but the booking status ' +
                    'could not be updated: ' +
                    statusError.message
                );

                return;
            }


            alert(
                'Proof of payment submitted for admin verification.'
            );


            location.reload();
        }


        loadPayments();

    </script>

</body>

</html>
