<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../css/app.css">

    <title>Child Progress</title>
</head>

<body>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Main Application JavaScript -->
    <script src="../js/app.js"></script>

    <script>

        parentGuard();

        const s = session();
        const c = s.child || {};


        async function loadProgress() {

            const { data, error } =
                await supabaseClient
                    .from('progress')
                    .select('*')
                    .eq('parent_email', s.email)
                    .order(
                        'updated_at',
                        { ascending: false }
                    )
                    .limit(1);


            if (error) {

                console.error(error);

                alert(
                    'Could not load progress: ' +
                    error.message
                );

                return;
            }


            const p =
                data && data.length > 0

                    ? data[0]

                    : {
                        reading: 0,
                        writing: 0,
                        comprehension: 0,
                        speaking: 0,
                        tutor_feedback:
                            'No tutor progress update has been added yet.'
                    };


            shell(
                'parent',
                'progress',
                "My Child's Progress",

                `
                <div class="progress-wrap">

                    <!-- Child Information -->
                    <div class="card child-card">

                        <img
                            src="../assets/images/${c.gender === 'Boy'
                                ? 'boy.png'
                                : 'girl.png'
                            }"
                        >

                        <h2>
                            ${c.first || ''}
                            ${c.last || ''}
                        </h2>

                        <p>
                            ${c.grade || ''}
                        </p>

                    </div>


                    <!-- Progress Information -->
                    <div class="card">

                        <h2>
                            Skills Overview
                        </h2>


                        ${[
                            'reading',
                            'writing',
                            'comprehension',
                            'speaking'

                        ].map(skill => {

                            const value =
                                Number(p[skill]) || 0;

                            return `

                                <div class="bar-row">

                                    <b>
                                        ${skill[0].toUpperCase()
                                            + skill.slice(1)}
                                    </b>

                                    <div class="bar">

                                        <span
                                            style="width: ${value}%"
                                        ></span>

                                    </div>

                                    <b>
                                        ${value}%
                                    </b>

                                </div>
                            `;

                        }).join('')}


                        <h3>
                            Tutor Comments
                        </h3>

                        <p>
                            ${p.tutor_feedback ||
                            'No tutor progress update has been added yet.'}
                        </p>

                    </div>

                </div>
                `
            );
        }


        loadProgress();

    </script>

</body>

</html>
