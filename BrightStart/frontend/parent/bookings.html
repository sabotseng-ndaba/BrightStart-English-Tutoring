<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="../css/app.css">
    <title>My Bookings</title>
</head>

<body>
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/app.js"></script>
    <script>parentGuard(); const s = session(), a = store.get('bs_bookings', []).filter(b => b.email === s.email); shell('parent', 'bookings', 'My Bookings', `<h1>My Bookings</h1><div class="table-wrap"><table><tr><th>Reference</th><th>Learner</th><th>Program</th><th>Date</th><th>Total</th><th>Booking</th><th>Payment</th></tr>${a.map(b => `<tr><td>${b.id}</td><td>${b.learner}</td><td>${b.program}</td><td>${b.date}</td><td>R${b.total}</td><td>${b.bookingStatus}</td><td><span class="status ${b.paymentStatus === 'Verified' ? 'paid' : 'pending'}">${b.paymentStatus}</span></td></tr>`).join('') || '<tr><td colspan="7">No bookings yet.</td></tr>'}</table></div>`)</script>
</body>

</html>
