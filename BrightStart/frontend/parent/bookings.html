<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../css/app.css">

    <title>My Bookings</title>
</head>

<body>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Main Application JavaScript -->
    <script src="../js/app.js"></script>

    <script>

        parentGuard();

        const s = session();


        async function loadBookings() {

            // Get this parent's bookings
            const {
                data: bookings,
                error: bookingsError
            } =
                await supabaseClient
                    .from('bookings')
                    .select('*')
                    .eq('parent_email', s.email)
                    .order(
                        'created_at',
                        { ascending: false }
                    );


            if (bookingsError) {

                console.error(bookingsError);

                alert(
                    'Could not load bookings: ' +
                    bookingsError.message
                );

                return;
            }


            // Get this parent's payments
            const {
                data: payments,
                error: paymentsError
            } =
                await supabaseClient
                    .from('payments')
                    .select('*')
                    .eq('parent_email', s.email);


            if (paymentsError) {

                console.error(paymentsError);

                alert(
                    'Could not load payment information: ' +
                    paymentsError.message
                );

                return;
            }


            const a = bookings || [];
            const paymentList = payments || [];


            shell(
                'parent',
                'bookings',
                'My Bookings',

                `
                <h1>My Bookings</h1>

                <div class="table-wrap">

                    <table>

                        <tr>
                            <th>Reference</th>
                            <th>Learner</th>
                            <th>Program</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Booking</th>
                            <th>Payment</th>
                        </tr>


                        ${a.map(b => {

                            const payment =
                                paymentList.find(
                                    p => Number(p.booking_id) === Number(b.id)
                                );


                            const paymentStatus =
                                payment
                                    ? payment.payment_status
                                    : 'Pending';


                            const amount =
                                payment
                                    ? `R${payment.amount}`
                                    : '—';


                            return `

                                <tr>

                                    <td>
                                        ${b.id}
                                    </td>

                                    <td>
                                        ${b.child_name || '—'}
                                    </td>

                                    <td>
                                        ${b.program || '—'}
                                    </td>

                                    <td>
                                        ${b.booking_date || '—'}
                                    </td>

                                    <td>
                                        ${amount}
                                    </td>

                                    <td>
                                        ${b.status || '—'}
                                    </td>

                                    <td>

                                        <span
                                            class="status ${
                                                paymentStatus === 'Verified'
                                                    ? 'paid'
                                                    : 'pending'
                                            }"
                                        >
                                            ${paymentStatus}
                                        </span>

                                    </td>

                                </tr>
                            `;

                        }).join('') || `

                            <tr>

                                <td colspan="7">
                                    No bookings yet.
                                </td>

                            </tr>

                        `}

                    </table>

                </div>
                `
            );
        }


        loadBookings();

    </script>

</body>

</html>
