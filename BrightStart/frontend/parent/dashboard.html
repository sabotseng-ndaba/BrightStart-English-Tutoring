<!doctype html>

<html>

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link
        rel="stylesheet"
        href="../css/app.css"
    >

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <title>Parent Dashboard</title>

</head>


<body>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Main Application JavaScript -->
    <script src="../js/app.js"></script>


    <script>

        parentGuard();

        const s = session();
        const c = s.child || {};


        async function loadDashboard() {

            // Get this parent's bookings
            const {
                data: bookings,
                error: bookingsError
            } =
                await supabaseClient
                    .from('bookings')
                    .select('*')
                    .eq('parent_email', s.email)
                    .order(
                        'created_at',
                        { ascending: false }
                    );


            if (bookingsError) {

                console.error(bookingsError);

                alert(
                    'Could not load booking information: ' +
                    bookingsError.message
                );

                return;
            }


            // Get this parent's payments
            const {
                data: payments,
                error: paymentsError
            } =
                await supabaseClient
                    .from('payments')
                    .select('*')
                    .eq('parent_email', s.email)
                    .order(
                        'created_at',
                        { ascending: false }
                    );


            if (paymentsError) {

                console.error(paymentsError);

                alert(
                    'Could not load payment information: ' +
                    paymentsError.message
                );

                return;
            }


            const bookingList =
                bookings || [];

            const paymentList =
                payments || [];


            const latestPayment =
                paymentList.length > 0
                    ? paymentList[0]
                    : null;


            const latestPaymentStatus =
                latestPayment
                    ? latestPayment.payment_status
                    : '—';


            shell(
                'parent',
                'dashboard',
                'Parent Dashboard',

                `

                <!-- WELCOME SECTION -->

                <div class="welcome">

                    <div>

                        <h1>
                            Welcome, ${s.parentName || 'Parent'} 👋
                        </h1>

                        <p>
                            Manage ${c.first || 'your child'}'s tutoring,
                            bookings, payments and learning progress
                            from one place.
                        </p>

                    </div>


                    <img
                        src="../assets/images/${
                            c.gender === 'Boy'
                                ? 'boy.png'
                                : 'girl.png'
                        }"
                        alt="Learner"
                    >

                </div>


                <!-- DASHBOARD SUMMARY -->

                <div class="cards">


                    <div class="card">

                        <h3>
                            My Child
                        </h3>

                        <div class="metric">
                            ${c.first || '—'}
                        </div>

                        <p>
                            ${c.grade || ''}
                        </p>

                    </div>


                    <div class="card">

                        <h3>
                            Bookings
                        </h3>

                        <div class="metric">
                            ${bookingList.length}
                        </div>

                        <p>
                            Total sessions booked
                        </p>

                    </div>


                    <div class="card">

                        <h3>
                            Latest Payment
                        </h3>

                        <div class="metric">
                            ${latestPaymentStatus}
                        </div>

                        <p>
                            Payment verification status
                        </p>

                    </div>


                </div>


                <!-- QUICK ACTIONS -->

                <h2>
                    What would you like to do?
                </h2>


                <div class="cards">


                    <!-- BOOK SESSION -->

                    <a
                        class="card"
                        href="booking.html"
                    >

                        <h3>
                            <i data-lucide="calendar-plus"></i>
                            Book a Session
                        </h3>

                        <p>
                            Choose a grade, program,
                            date and time.
                        </p>

                    </a>


                    <!-- VIEW PROGRESS -->

                    <a
                        class="card"
                        href="progress.html"
                    >

                        <h3>
                            <i data-lucide="chart-no-axes-column-increasing"></i>
                            View Progress
                        </h3>

                        <p>
                            See ${c.first || 'your child'}'s
                            reading, writing, comprehension
                            and speaking progress.
                        </p>

                    </a>


                    <!-- CONTACT -->

                    <a
                        class="card"
                        href="contact.html"
                    >

                        <h3>
                            <i data-lucide="message-circle"></i>
                            Contact BrightStart
                        </h3>

                        <p>
                            Call, WhatsApp or email us.
                        </p>

                    </a>


                </div>

                `
            );


            // Convert Lucide placeholders into SVG icons
            lucide.createIcons();
        }


        loadDashboard();

    </script>

</body>

</html>
