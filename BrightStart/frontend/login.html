<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In</title>
    <link rel="stylesheet" href="css/app.css">
</head>

<body>

    <div class="auth-shell">
        <div class="auth-card">
            <div class="brand">
                <img src="assets/images/sun-book.png">
                <div>
                    <strong>BrightStart</strong>
                    <small>English Tutoring</small>
                </div>
            </div>

            <h1>Welcome back</h1>
            <p class="small">
                Choose how you are signing in.
            </p>

            <div class="role-switch">
                <button id="pBtn" class="btn btn-blue">
                    Parent / Guardian
                </button>
                <button id="aBtn" class="btn btn-outline">
                    Tutor / Admin
                </button>
            </div>

            <form id="loginForm" class="form-grid">
                <div class="field full">
                    <label>Email</label>
                    <input id="email" type="email" required>
                </div>

                <div class="field full">
                    <label>Password</label>
                    <input id="password" type="password" required>
                </div>
                <div class="field full">
                    <button class="btn btn-blue">
                        Sign In
                    </button>
                </div>
            </form>

            <p id="msg"></p>
            <p id="reg">
                New parent?
                <a style="color:#2879c7; font-weight:800" href="register.html">
                    Create an account
                </a>
            </p>

            <p class="small">
                Demo Tutor/Admin:
                amanda.jacobs@brightstartenglish.co.za
                · Password: Aobs
            </p>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>

    <script>

        let role = 'parent';

        pBtn.onclick = () => {

            role = 'parent';

            pBtn.className = 'btn btn-blue';
            aBtn.className = 'btn btn-outline';

            reg.style.display = 'block';
        };


        aBtn.onclick = () => {

            role = 'admin';

            aBtn.className = 'btn btn-blue';
            pBtn.className = 'btn btn-outline';

            reg.style.display = 'none';
        };


        loginForm.onsubmit = async e => {

            e.preventDefault();

            if (role === 'parent') {

                msg.textContent = 'Signing in...';

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email.value,
                        password: password.value
                    });

                if (error) {
                    console.error(error);
                    msg.textContent = 'Login failed: ' + error.message;
                    return;
                }

                const { data: parentData, error: parentError } =
                    await supabaseClient
                        .from('parents')
                        .select('*')
                        .eq('email', data.user.email)
                        .single();

                if (parentError) {
                    console.error(parentError);
                    msg.textContent = 'Could not load parent profile: ' + parentError.message;
                    return;
                }

                store.set('bs_session', {
                    role: 'parent',
                    email: parentData.email,
                    parentName: parentData.first_name + ' ' + parentData.last_name,
                    child: {
                        first: parentData.child_first_name,
                        last: parentData.child_last_name,
                        gender: parentData.child_gender,
                        grade: parentData.child_grade
                    }
                });

                location.href = 'parent/dashboard.html';


            } else {

                const a = store
                    .get('bs_admins', [])
                    .find(
                        x =>
                            x.email.toLowerCase() === email.value.toLowerCase() &&
                            x.password === password.value
                    );

                if (a) {

                    store.set('bs_session', {
                        role: 'admin',
                        email: a.email,
                        name: a.first + ' ' + a.last
                    });

                    location.href = 'admin/dashboard.html';

                } else {

                    msg.textContent =
                        'Tutor/Admin login details are incorrect.';
                }
            }
        };

    </script>

</body>

</html>
