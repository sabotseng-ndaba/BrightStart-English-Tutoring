<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In</title>
    <link rel="stylesheet" href="css/app.css">
</head>

<body>

    <div class="auth-shell">
        <div class="auth-card">
            <div class="brand">
                <img src="assets/images/sun-book.png">
                <div>
                    <strong>BrightStart</strong>
                    <small>English Tutoring</small>
                </div>
            </div>

            <h1>Welcome back</h1>
            <p class="small">
                Choose how you are signing in.
            </p>

            <div class="role-switch">
                <button id="pBtn" class="btn btn-blue">
                    Parent / Guardian
                </button>
                <button id="aBtn" class="btn btn-outline">
                    Tutor / Admin
                </button>
            </div>

            <form id="loginForm" class="form-grid">
                <div class="field full">
                    <label>Email</label>
                    <input id="email" type="email" required>
                </div>

                <div class="field full">
                    <label>Password</label>
                    <input id="password" type="password" required>
                </div>
                <div class="field full">
                    <button class="btn btn-blue">
                        Sign In
                    </button>
                </div>
            </form>

            <p id="msg"></p>
            <p id="reg">
                New parent?
                <a style="color:#2879c7; font-weight:800" href="register.html">
                    Create an account
                </a>
            </p>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>

    <script>

        let role = 'parent';

        pBtn.onclick = () => {

            role = 'parent';

            pBtn.className = 'btn btn-blue';
            aBtn.className = 'btn btn-outline';

            reg.style.display = 'block';
        };


        aBtn.onclick = () => {

            role = 'admin';

            aBtn.className = 'btn btn-blue';
            pBtn.className = 'btn btn-outline';

            reg.style.display = 'none';
        };


        loginForm.onsubmit = async e => {

            e.preventDefault();

            if (role === 'parent') {

                msg.textContent = 'Signing in...';

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email.value,
                        password: password.value
                    });

                if (error) {
                    console.error(error);
                    msg.textContent = 'Login failed: ' + error.message;
                    return;
                }

                // Look for an existing parent profile
                let { data: parentData, error: parentError } =
                    await supabaseClient
                        .from('parents')
                        .select('*')
                        .eq('email', data.user.email)
                        .maybeSingle();

                if (parentError) {
                    console.error(parentError);
                    msg.textContent =
                        'Could not load parent profile: ' +
                        parentError.message;
                    return;
                }


                // If this is the parent's first login after email verification,
                // create their parent profile using the details saved at registration.
                if (!parentData) {

                    const metadata =
                        data.user.user_metadata || {};

                    const {
                        data: newParent,
                        error: createError
                    } =
                        await supabaseClient
                            .from('parents')
                            .insert([
                                {
                                    email:
                                        data.user.email,

                                    phone:
                                        metadata.phone || '',

                                    first_name:
                                        metadata.first_name || '',

                                    last_name:
                                        metadata.last_name || '',

                                    child_first_name:
                                        metadata.child_first_name || '',

                                    child_last_name:
                                        metadata.child_last_name || '',

                                    child_gender:
                                        metadata.child_gender || '',

                                    child_grade:
                                        metadata.child_grade || ''
                                }
                            ])
                            .select()
                            .single();


                    if (createError) {

                        console.error(createError);

                        msg.textContent =
                            'Could not create parent profile: ' +
                            createError.message;

                        return;
                    }


                    parentData = newParent;
                }

                store.set('bs_session', {
                    role: 'parent',
                    email: parentData.email,
                    parentName: parentData.first_name + ' ' + parentData.last_name,
                    child: {
                        first: parentData.child_first_name,
                        last: parentData.child_last_name,
                        gender: parentData.child_gender,
                        grade: parentData.child_grade
                    }
                });

                location.href = 'parent/dashboard.html';


            } else {

                const {
                    data: authData,
                    error: authError
                } = await supabaseClient.auth.signInWithPassword({
                    email: email.value.trim(),
                    password: password.value
                });

                if (authError) {
                    msg.textContent = 'Invalid staff email or password.';
                    return;
                }


                // Get the staff profile linked to this Auth account
                const {
                    data: staffData,
                    error: staffError
                } = await supabaseClient
                    .from('staff')
                    .select('*')
                    .eq('user_id', authData.user.id)
                    .maybeSingle();


                if (staffError || !staffData) {

                    await supabaseClient.auth.signOut();

                    msg.textContent =
                        'This account is not registered as a BrightStart staff member.';

                    return;
                }


                // Create the BrightStart staff session
                store.set('bs_session', {
                    role: staffData.role,
                    email: staffData.email,
                    name:
                        `${staffData.first_name || ''} ${staffData.last_name || ''}`.trim(),
                    user_id: staffData.user_id
                });


                // Send each staff role to the correct area
                if (staffData.role === 'admin') {

                    location.href = 'admin/dashboard.html';

                } else if (staffData.role === 'tutor') {

                    location.href = 'admin/progress.html';

                } else {

                    await supabaseClient.auth.signOut();
                    store.remove('bs_session');

                    msg.textContent =
                        'Your staff account does not have a valid role.';

                    return;
                }

        }
        };

    </script>

</body>

</html>
