<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>BrightStart English Tutoring</title>

    <link
        rel="stylesheet"
        href="css/app.css"
    >
</head>

<body class="public">

    <div class="landing">

        <!-- HEADER -->
        <header class="public-top">

            <div class="brand">

                <img
                    src="assets/images/sun-book.png"
                    alt="BrightStart"
                >

                <div>
                    <strong>BrightStart</strong>
                    <small>English Tutoring</small>
                </div>

            </div>

            <nav class="public-links">

                <a href="programs.html">
                    Programs
                </a>

                <a href="about.html">
                    Contact
                </a>

                <a
                    class="btn btn-outline"
                    href="login.html"
                >
                    Sign In
                </a>

            </nav>

        </header>


        <!-- HERO SECTION -->
        <section class="hero">

            <div class="hero-content">

                <h1>
                    Building strong English foundations for
                    <span class="green">Grade 1–3</span>
                    learners.
                </h1>

                <p>
                    We help children read, write and understand
                    with confidence through friendly, focused
                    English tutoring.
                </p>


                <!-- ACTION BUTTONS -->
                <div class="actions">

                    <!-- BOOK A SESSION -->
                    <a
                        class="btn btn-blue"
                        href="login.html"
                    >

                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <rect
                                x="3"
                                y="4"
                                width="18"
                                height="17"
                                rx="2"
                            ></rect>

                            <line
                                x1="8"
                                y1="2"
                                x2="8"
                                y2="6"
                            ></line>

                            <line
                                x1="16"
                                y1="2"
                                x2="16"
                                y2="6"
                            ></line>

                            <line
                                x1="3"
                                y1="10"
                                x2="21"
                                y2="10"
                            ></line>
                        </svg>

                        Book a Session

                    </a>


                    <!-- VIEW PROGRAMS -->
                    <a
                        class="btn btn-green"
                        href="programs.html"
                    >

                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"
                            ></path>

                            <path
                                d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
                            ></path>
                        </svg>

                        View Programs

                    </a>


                    <!-- CONTACT US -->
                    <a
                        class="btn btn-light"
                        href="about.html"
                    >

                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                d="M22 16.92v3a2 2 0 0 1-2.18 2
                                19.79 19.79 0 0 1-8.63-3.07
                                19.5 19.5 0 0 1-6-6
                                19.79 19.79 0 0 1-3.07-8.67
                                A2 2 0 0 1 4.11 2h3
                                a2 2 0 0 1 2 1.72
                                12.84 12.84 0 0 0 .7 2.81
                                2 2 0 0 1-.45 2.11L8.09 9.91
                                a16 16 0 0 0 6 6
                                l1.27-1.27
                                a2 2 0 0 1 2.11-.45
                                12.84 12.84 0 0 0 2.81.7
                                A2 2 0 0 1 22 16.92z"
                            ></path>
                        </svg>

                        Contact Us

                    </a>

                </div>

            </div>


            <!-- HERO IMAGE -->
            <img
                class="hero-art"
                src="assets/images/home-kids.png"
                alt="Children reading"
            >

        </section>

    </div>

</body>

</html>
