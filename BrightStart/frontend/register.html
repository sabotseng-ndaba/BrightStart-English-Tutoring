<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Parent Registration</title>

    <link rel="stylesheet" href="css/app.css">
</head>

<body>

    <div class="auth-shell">

        <div class="auth-card">

            <!-- BrightStart Branding -->
            <div class="brand">

                <img
                    src="assets/images/sun-book.png"
                    alt="BrightStart logo"
                >

                <div>
                    <strong>BrightStart</strong>
                    <small>Parent Registration</small>
                </div>

            </div>


            <!-- Registration Form -->
            <form id="f" class="form-grid">

                <div class="field">
                    <label>Parent first name</label>
                    <input id="first" required>
                </div>

                <div class="field">
                    <label>Parent surname</label>
                    <input id="last" required>
                </div>

                <div class="field">
                    <label>Email</label>
                    <input id="email" type="email" required>
                </div>

                <div class="field">
                    <label>Phone</label>
                    <input id="phone" required>
                </div>

                <div class="field">
                    <label>Password</label>
                    <input
                        id="password"
                        type="password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="field">
                    <label>Confirm password</label>
                    <input
                        id="confirm"
                        type="password"
                        required
                    >
                </div>

                <div class="field">
                    <label>Child first name</label>
                    <input id="childFirst" required>
                </div>

                <div class="field">
                    <label>Child surname</label>
                    <input id="childLast" required>
                </div>

                <div class="field">

                    <label>Child gender</label>

                    <select id="gender" required>
                        <option value="">Select</option>
                        <option>Girl</option>
                        <option>Boy</option>
                        <option>Other / Prefer not to say</option>
                    </select>

                </div>

                <div class="field">

                    <label>Grade</label>

                    <select id="grade" required>
                        <option>Grade 1</option>
                        <option>Grade 2</option>
                        <option>Grade 3</option>
                    </select>

                </div>

                <div class="field full">

                    <button class="btn btn-green">
                        Create Parent Account
                    </button>

                </div>

            </form>


            <!-- Registration Message -->
            <p id="msg"></p>

            <p>
                <a href="login.html">
                    Already registered? Sign in
                </a>
            </p>

        </div>

    </div>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Main Application JavaScript -->
    <script src="js/app.js"></script>


    <script>
        const registrationForm = document.getElementById('f');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm');
        const message = document.getElementById('msg');


        registrationForm.addEventListener('submit', async e => {

            e.preventDefault();


            // Check that both passwords match
            if (passwordInput.value !== confirmPasswordInput.value) {

                message.textContent = 'Passwords do not match.';
                return;
            }

            message.textContent = '';


            // Create Supabase Auth account
            const emailValue = document.getElementById('email').value;
            const passwordValue = passwordInput.value;

            const { data: authData, error: authError } =
                await supabaseClient.auth.signUp({
                    email: emailValue,
                    password: passwordValue
                });


            if (authError) {

                console.error(authError);

                message.textContent =
                    'Registration failed: ' + authError.message;

                return;
            }


            // Save parent and learner information
            const { data, error } = await supabaseClient
                .from('parents')
                .insert([
                    {
                        email: document.getElementById('email').value,
                        phone: document.getElementById('phone').value,
                        first_name: document.getElementById('first').value,
                        last_name: document.getElementById('last').value,
                        child_first_name: document.getElementById('childFirst').value,
                        child_last_name: document.getElementById('childLast').value,
                        child_gender: document.getElementById('gender').value,
                        child_grade: document.getElementById('grade').value
                    }
                ]);


            if (error) {

                console.error(error);

                message.textContent =
                    'Registration failed: ' + error.message;

                return;
            }


            // Create local parent session
            const u = {

                first: document.getElementById('first').value,
                last: document.getElementById('last').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: passwordInput.value,

                child: {
                    first: document.getElementById('childFirst').value,
                    last: document.getElementById('childLast').value,
                    gender: document.getElementById('gender').value,
                    grade: document.getElementById('grade').value
                }
            };


            store.set('bs_parent', u);

            store.set('bs_session', {
                role: 'parent',
                email: u.email,
                parentName: u.first + ' ' + u.last,
                child: u.child
            });


            // Open parent dashboard
            location.href = 'parent/dashboard.html';
        });
    </script>

</body>

</html>
